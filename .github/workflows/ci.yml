name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore BlazorAiChat/BlazorAiChat.sln

    - name: Build
      run: dotnet build BlazorAiChat/BlazorAiChat.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test BlazorAiChat/BlazorAiChat.sln --no-build --configuration Release --verbosity normal
