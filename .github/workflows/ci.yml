name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: npm

    - name: Restore dependencies
      run: dotnet restore BlazorAiChat/BlazorAiChat.sln

    - name: Build
      run: dotnet build BlazorAiChat/BlazorAiChat.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test BlazorAiChat/BlazorAiChat.sln --no-build --configuration Release --verbosity normal

    - name: Install browser test dependencies
      run: npm ci

    - name: Install Chromium for browser tests
      run: npx playwright install --with-deps chromium

    - name: Run browser smoke test
      run: npm run test:e2e

    - name: Upload browser test evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-test-evidence
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
